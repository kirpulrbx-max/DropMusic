[package]
name = "dropmusic"
version = "0.1.0"
description = "A Windows desktop music hub."
authors = ["DropMusic contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "dropmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
